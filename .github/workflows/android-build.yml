name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Web Build & Type Check
        run: |
          npm install --legacy-peer-deps --no-audit
          npm run lint
          npm test
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Recreate google-services.json from secret
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Recreating android/app/google-services.json from repository secret..."
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_SECRET" > android/app/google-services.json
            mkdir -p android/app/src/debug
            echo "$GOOGLE_SERVICES_SECRET" > android/app/src/debug/google-services.json

            # Validate JSON content and package clients without printing secrets
            node -e '
              try {
                const raw = process.env.GOOGLE_SERVICES_SECRET;
                const parsed = JSON.parse(raw);
                if (!parsed.client || !Array.isArray(parsed.client)) {
                  console.error("Invalid google-services.json: missing client array");
                  process.exit(1);
                }
                const packageNames = parsed.client.map(c => c.client_info?.android_client_info?.package_name).filter(Boolean);
                console.log("Verified client packages:", packageNames.join(", "));
                if (!packageNames.includes("com.aiprimestudio.app")) {
                  console.error("Missing required client: com.aiprimestudio.app");
                  process.exit(1);
                }
              } catch (e) {
                console.error("Failed to parse GOOGLE_SERVICES_JSON as valid JSON:", e.message);
                process.exit(1);
              }
            '
          elif [ -f "android/app/google-services.json" ]; then
            echo "Found existing android/app/google-services.json in workspace."
            if [ ! -f "android/app/src/debug/google-services.json" ]; then
              mkdir -p android/app/src/debug
              cp android/app/google-services.json android/app/src/debug/google-services.json
            fi
          else
            echo "::error::Both android/app/google-services.json and GOOGLE_SERVICES_JSON secret are missing!"
            exit 1
          fi

      - name: Verify Firebase Configuration
        run: |
          if [ -f "android/app/google-services.json" ]; then
            echo "Release google-services.json is present."
          else
            echo "::error::android/app/google-services.json is missing!"
            exit 1
          fi
          if [ -f "android/app/src/debug/google-services.json" ]; then
            echo "Debug google-services.json (com.aiprimestudio.app.debug) is present."
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Release Bundle (AAB) if Signing Secret is Present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret detected. Decoding release.keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            export KEYSTORE_FILE="release.keystore"
            cd android
            ./gradlew bundleRelease --stacktrace
            echo "RELEASE_AAB_BUILT=true" >> $GITHUB_ENV
          else
            echo "::notice title=Release Signing Status::KEYSTORE_BASE64 secret is not configured in GitHub Repository Secrets. Debug APK built successfully; Release AAB build is pending user keystore."
            echo "RELEASE_AAB_BUILT=false" >> $GITHUB_ENV
          fi

      - name: Upload Release AAB Artifact
        if: env.RELEASE_AAB_BUILT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
