name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Web Build & Type Check
        run: |
          npm install --legacy-peer-deps --no-audit
          npm run lint
          npm test
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Recreate google-services.json from secret
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Recreating android/app/google-services.json from repository secret..."
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_SECRET" > android/app/google-services.json
            mkdir -p android/app/src/debug
            echo "$GOOGLE_SERVICES_SECRET" > android/app/src/debug/google-services.json

            # Validate JSON content and package clients without printing secrets
            node -e '
              try {
                const raw = process.env.GOOGLE_SERVICES_SECRET;
                const parsed = JSON.parse(raw);
                if (!parsed.client || !Array.isArray(parsed.client)) {
                  console.error("Invalid google-services.json: missing client array");
                  process.exit(1);
                }
                const packageNames = parsed.client.map(c => c.client_info?.android_client_info?.package_name).filter(Boolean);
                console.log("Verified client packages:", packageNames.join(", "));
                if (!packageNames.includes("com.aiprimestudio.app")) {
                  console.error("Missing required client: com.aiprimestudio.app");
                  process.exit(1);
                }
                if (!packageNames.includes("com.aiprimestudio.app.debug")) {
                  console.error("Missing required client: com.aiprimestudio.app.debug");
                  process.exit(1);
                }
              } catch (e) {
                console.error("Failed to parse GOOGLE_SERVICES_JSON as valid JSON:", e.message);
                process.exit(1);
              }
            '
          elif [ -f "android/app/google-services.json" ]; then
            echo "Found existing android/app/google-services.json in workspace."
            if [ ! -f "android/app/src/debug/google-services.json" ]; then
              mkdir -p android/app/src/debug
              cp android/app/google-services.json android/app/src/debug/google-services.json
            fi
          else
            echo "::error::Both android/app/google-services.json and GOOGLE_SERVICES_JSON secret are missing!"
            exit 1
          fi

      - name: Verify Firebase Configuration
        run: |
          if [ -f "android/app/google-services.json" ]; then
            echo "Release google-services.json is present."
          else
            echo "::error::android/app/google-services.json is missing!"
            exit 1
          fi
          if [ -f "android/app/src/debug/google-services.json" ]; then
            echo "Debug google-services.json (com.aiprimestudio.app.debug) is present."
          fi
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("android/app/google-services.json", "utf8");
            const parsed = JSON.parse(raw);
            const packageNames = (parsed.client || []).map(c => c.client_info?.android_client_info?.package_name).filter(Boolean);
            console.log("Verified client packages in google-services.json:", packageNames.join(", "));
            if (!packageNames.includes("com.aiprimestudio.app")) {
              console.error("Missing required client: com.aiprimestudio.app");
              process.exit(1);
            }
            if (!packageNames.includes("com.aiprimestudio.app.debug")) {
              console.error("Missing required client: com.aiprimestudio.app.debug");
              process.exit(1);
            }
          '

      - name: Ensure Canonical Stable Debug Keystore is Present
        run: |
          mkdir -p android/app
          if [ -f "android/app/debug.keystore" ]; then
            echo "android/app/debug.keystore is present in workspace."
          elif [ -f "android/app/debug.keystore.base64" ]; then
            echo "Restoring android/app/debug.keystore from android/app/debug.keystore.base64..."
            base64 -d android/app/debug.keystore.base64 > android/app/debug.keystore
          else
            echo "Restoring canonical stable debug keystore from embedded base64 specification..."
            echo "" | base64 -d > android/app/debug.keystore
          fi
          chmod 644 android/app/debug.keystore
          ls -la android/app/debug.keystore

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Strict Debug Keystore & APK Fingerprint Verification
        run: |
          set -euo pipefail
          echo "=== 1. Checking android/app/debug.keystore presence ==="
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "::error::CRITICAL: android/app/debug.keystore does not exist in workspace!"
            exit 1
          fi

          echo "=== 2. Extracting Keystore Certificate Fingerprints via keytool ==="
          KEYSTORE_SHA1=$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android | grep -i "SHA1:" | head -n 1 | awk '{print $NF}' | tr -d ' \r\n' | tr '[:lower:]' '[:upper:]')
          KEYSTORE_SHA256=$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android | grep -i "SHA256:" | head -n 1 | awk '{print $NF}' | tr -d ' \r\n' | tr '[:lower:]' '[:upper:]')

          echo "Keystore SHA-1:   $KEYSTORE_SHA1"
          echo "Keystore SHA-256: $KEYSTORE_SHA256"

          if [ -z "$KEYSTORE_SHA1" ] || [ -z "$KEYSTORE_SHA256" ]; then
            echo "::error::Failed to extract SHA-1 or SHA-256 from android/app/debug.keystore!"
            exit 1
          fi

          echo "=== 3. Locating apksigner tool ==="
          APKSIGNER=$(which apksigner 2>/dev/null || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::CRITICAL: apksigner not found or not executable! Failing build per strict verification rules."
            exit 1
          fi
          echo "Found apksigner at: $APKSIGNER"

          echo "=== 4. Extracting Built APK Certificate Fingerprints via apksigner ==="
          APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::CRITICAL: Built APK $APK_FILE not found!"
            exit 1
          fi

          APK_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_FILE")
          echo "$APK_OUTPUT"

          APK_SHA1=$(echo "$APK_OUTPUT" | grep -i "SHA-1 digest:" | head -n 1 | awk '{print $NF}' | tr -d ' \r\n' | tr '[:lower:]' '[:upper:]')
          CLEAN_KS_SHA1=$(echo "$KEYSTORE_SHA1" | tr -d ':')
          CLEAN_APK_SHA1=$(echo "$APK_SHA1" | tr -d ':')

          APK_SHA256=$(echo "$APK_OUTPUT" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}' | tr -d ' \r\n' | tr '[:lower:]' '[:upper:]')
          CLEAN_KS_SHA256=$(echo "$KEYSTORE_SHA256" | tr -d ':')
          CLEAN_APK_SHA256=$(echo "$APK_SHA256" | tr -d ':')

          echo "Normalized Keystore SHA-1: $CLEAN_KS_SHA1"
          echo "Normalized APK SHA-1:      $CLEAN_APK_SHA1"
          echo "Normalized Keystore SHA-256: $CLEAN_KS_SHA256"
          echo "Normalized APK SHA-256:      $CLEAN_APK_SHA256"

          if [ "$CLEAN_KS_SHA1" != "$CLEAN_APK_SHA1" ]; then
            echo "::error::CRITICAL MISMATCH: Built APK SHA-1 ($CLEAN_APK_SHA1) does not match Keystore SHA-1 ($CLEAN_KS_SHA1)!"
            exit 1
          fi

          if [ "$CLEAN_KS_SHA256" != "$CLEAN_APK_SHA256" ]; then
            echo "::error::CRITICAL MISMATCH: Built APK SHA-256 ($CLEAN_APK_SHA256) does not match Keystore SHA-256 ($CLEAN_KS_SHA256)!"
            exit 1
          fi

          echo "=== 5. SUCCESS: Built APK signing certificate 100% matches stable debug.keystore! ==="

      - name: Build Release Bundle (AAB) if Signing Secret is Present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PROD_SERVER_URL: ${{ secrets.PROD_SERVER_URL }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$PROD_SERVER_URL" ]; then
            echo "Release secrets detected. Decoding release.keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            export KEYSTORE_FILE="release.keystore"
            cd android
            ./gradlew bundleRelease -PPROD_SERVER_URL="$PROD_SERVER_URL" --stacktrace
            echo "RELEASE_AAB_BUILT=true" >> $GITHUB_ENV
          elif [ -n "$KEYSTORE_BASE64" ] && [ -z "$PROD_SERVER_URL" ]; then
            echo "::error title=Missing PROD_SERVER_URL::KEYSTORE_BASE64 is present but PROD_SERVER_URL secret is missing. Release build cannot proceed without a verified production URL."
            echo "RELEASE_AAB_BUILT=false" >> $GITHUB_ENV
            exit 1
          else
            echo "::notice title=Release Signing Status::KEYSTORE_BASE64 and/or PROD_SERVER_URL secrets are not configured in GitHub Repository Secrets. Debug APK built successfully; Release AAB build is pending user release secrets."
            echo "RELEASE_AAB_BUILT=false" >> $GITHUB_ENV
          fi

      - name: Upload Release AAB Artifact
        if: env.RELEASE_AAB_BUILT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
