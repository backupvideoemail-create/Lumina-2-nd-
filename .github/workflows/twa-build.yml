name: Android TWA Build (Dual APK + AAB)

on:
  workflow_dispatch:
    inputs:
      twa_start_url:
        description: 'Verified production HTTPS Website origin (e.g., https://aiprimestudio.app)'
        required: true
        type: string
      twa_version_code:
        description: 'Target Version Code verified against Play Console (must be >= 2)'
        required: true
        default: '2'
        type: string
      twa_version_name:
        description: 'Target Version Name'
        required: true
        default: '1.0.1'
        type: string

jobs:
  build-twa:
    name: Build & Sign TWA APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for TWA Gradlew
        run: chmod +x android-twa/gradlew

      - name: Recreate Release Keystore from Repository Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::CRITICAL: KEYSTORE_BASE64 repository secret is missing. Release artifacts require production upload keystore."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android-twa/app/release.keystore
          echo "Release keystore decoded successfully."

      - name: Assemble Release APK
        env:
          KEYSTORE_FILE: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TWA_START_URL: ${{ inputs.twa_start_url }}
          TWA_VERSION_CODE: ${{ inputs.twa_version_code }}
          TWA_VERSION_NAME: ${{ inputs.twa_version_name }}
        run: |
          cd android-twa
          ./gradlew assembleRelease \
            -PTWA_START_URL="$TWA_START_URL" \
            -PTWA_VERSION_CODE="$TWA_VERSION_CODE" \
            -PTWA_VERSION_NAME="$TWA_VERSION_NAME" \
            --stacktrace

      - name: Build Release Bundle (AAB)
        env:
          KEYSTORE_FILE: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TWA_START_URL: ${{ inputs.twa_start_url }}
          TWA_VERSION_CODE: ${{ inputs.twa_version_code }}
          TWA_VERSION_NAME: ${{ inputs.twa_version_name }}
        run: |
          cd android-twa
          ./gradlew bundleRelease \
            -PTWA_START_URL="$TWA_START_URL" \
            -PTWA_VERSION_CODE="$TWA_VERSION_CODE" \
            -PTWA_VERSION_NAME="$TWA_VERSION_NAME" \
            --stacktrace

      - name: Verify Built APK Certificate Fingerprints via apksigner
        run: |
          set -euo pipefail
          APK_FILE="android-twa/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::CRITICAL: Built APK $APK_FILE not found!"
            exit 1
          fi

          APKSIGNER=$(which apksigner 2>/dev/null || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found or not executable!"
            exit 1
          fi

          echo "=== Verifying TWA Release APK Signing Signature ==="
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_FILE")
          echo "$CERT_OUTPUT"

          APK_SHA256=$(echo "$CERT_OUTPUT" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}' | tr -d ' \r\n' | tr '[:lower:]' '[:upper:]')
          echo "Verified TWA APK SHA-256: $APK_SHA256"

      - name: Upload TWA Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed.apk
          path: android-twa/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload TWA Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle.aab
          path: android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
